# @see src/routes/email.js
tags:
  - name: Email
    description: Email sending

paths:
  /send-email:
    post:
      summary: Send an email
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, text]
              properties:
                email:
                  type: string
                text:
                  type: string
      responses:
        '200':
          description: Email sent successfully
